[project]
name = "caine-chatbot"
version = "0.1.0"
description = "CAINE's text chatbot component: an honestly-untrained character-level neural net that only learns from what you tell it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
caine-server = "caine.server:main"
caine-chat = "caine.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["caine*"]
